name: daily-collect

on:
  schedule:
    - cron: "20 10 * * *"   # 매일 19:20 KST (DRAMeXchange 당일 현물가 반영 후)
    - cron: "50 22 * * *"   # 매일 07:50 KST (미국·일본 주가, 밤사이 뉴스)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - name: 바뀐 데이터만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
